server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # The OpenCascade WASM is ~85% of the payload and compresses well
    # (~15MB raw → ~4.6MB gzipped), so gzip it along with the text assets.
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/wasm;
    gzip_min_length 1024;

    # Content-hashed assets (incl. the OpenCascade WASM imported via ?url)
    # are immutable — cache forever, mirroring static/_headers.
    location /_app/immutable/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location ~* \.wasm$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # SPA fallback — single client-rendered route.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
